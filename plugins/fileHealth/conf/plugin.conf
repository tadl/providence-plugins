# Disabled until an operator initializes private storage and schedules checks.
enable = 0
state_directory = /var/lib/providence-file-health
versions = original
batch_size = 25
# Soft batch budget: all configured versions of one representation finish first.
max_seconds = 60
# Start a new sweep after this interval from the preceding sweep's START.
check_interval_seconds = 604800
worker_stale_seconds = 3600
