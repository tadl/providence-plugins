# Enable plugin
# Keep this at 0 in version-controlled defaults and enable in plugin.local.conf.
enable = 0

# Use the uploaded file name without extension as the representation identifier.
strip_extension = 1

# If an idno is already set before insert, leave it alone.
preserve_existing_idno_on_insert = 1

# When media is replaced and the stored original filename changes, update idno to match.
sync_on_media_replace = 1

# If a user manually changes idno in the same save where media is replaced, leave it alone.
preserve_manual_idno_on_update = 1

# If a new representation has no preferred label, set it from the uploaded filename.
# This prevents standalone representation records from falling back to [BLANK].
set_preferred_label_from_filename_when_blank = 1

# If media is replaced and the current preferred label is blank, update it from the new filename.
update_blank_preferred_label_on_media_replace = 1

# Normalize whitespace in filenames to this character.
replace_whitespace_with = _

# Lowercase generated identifiers.
lowercase = 0

# Ensure generated identifiers are unique by appending a numeric suffix when needed.
ensure_unique = 1

# Separator used before uniqueness suffixes.
suffix_separator = -
