# Institution-neutral defaults. Put site settings in plugin.local.conf.
# Copy plugin.local.conf.example as a starting point; preserve it during updates.
enable = 0
state_directory =
python_binary = /usr/bin/python3
organization_code =
source_organization =
contact_name =
contact_email =
part_size_bytes = 50000000000
# MDPN members must explicitly select mdpn and their approved organization name.
bagit_profile = generic
transport = local
destination_id = local-testing
sftp_host =
sftp_port = 22
sftp_directory =
sftp_host_key_sha256 =
credentials_file =
# Blank uses native hierarchy roots. Set a Text element code for organizational units.
organizational_unit_element =
# Quotes keep brackets literal in Providence configuration syntax.
organizational_unit_marker = "[[organizational_unit]]"
